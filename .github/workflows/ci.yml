name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  prototype:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests du prototype Python
        run: python -m unittest discover -s prototype/tests -t .

  app:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Versions
        run: swift --version && xcodebuild -version
      - name: Tests du cœur (base factice)
        working-directory: app
        run: swift test
      - name: Construction de DistiX.app
        run: scripts/build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: DistiX
          path: build/DistiX.zip
          if-no-files-found: error
